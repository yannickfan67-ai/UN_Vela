name: hosted-os
on: [push, pull_request]

jobs:
  hosted:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install libcurl development files
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Configure hosted carrier
        run: cmake -S . -B build-hosted -DCMAKE_BUILD_TYPE=Release
      - name: Build hosted carrier
        run: cmake --build build-hosted --config Release
      - name: Run hosted carrier and browser runtime tests
        run: ctest --test-dir build-hosted -C Release --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libcurl development files
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Configure ASan and UBSan build
        run: >-
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - name: Build sanitizer targets
        run: cmake --build build-sanitize
      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure
